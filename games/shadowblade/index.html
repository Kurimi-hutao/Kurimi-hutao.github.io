<style>
:root{--ink:#090c15;--gold:#d9b47a;--paper:#efdfc4;--red:#b83f55;--line:#5c5262;--pink:#f27b9e}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#090b13;color:var(--paper);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC","Microsoft Yahei",monospace;overflow-x:hidden}body{background:radial-gradient(ellipse at 50% 15%,#2a2235 0%,#10121d 45%,#090b13 85%);display:flex;align-items:center;justify-content:center;min-height:100dvh;user-select:none;-webkit-user-select:none;touch-action:manipulation}button{font:inherit;color:inherit;cursor:pointer}#shell{width:min(100vw,1120px);padding:12px clamp(8px,2vw,20px) max(10px,env(safe-area-inset-bottom));margin:auto}.mast{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 10px}.brand{display:flex;align-items:baseline;gap:11px}.brand strong{font-size:clamp(19px,3.8vw,28px);font-weight:900;letter-spacing:5px;text-shadow:0 0 22px #c5456277}.brand em{color:#b5a4ab;font-size:9px;letter-spacing:2px;font-style:normal}.headbuttons{display:flex;gap:7px}.topbtn{border:1px solid #59505d;background:#191824ab;padding:7px 11px;border-radius:2px;font-size:12px;min-width:38px}.topbtn:active,.topbtn:hover{background:#382734}.gameframe{position:relative;aspect-ratio:16/9;width:100%;background:#131420;overflow:hidden;border:2px solid #67515e;box-shadow:0 0 0 3px #14121c,0 20px 80px #000b,inset 0 0 20px #000;isolation:isolate;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}.framevignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 50px #06070d80}.hud{position:absolute;z-index:5;inset:12px 14px auto;display:none;justify-content:space-between;gap:15px;pointer-events:none;text-shadow:1px 2px #000}.hud.show{display:flex}.meter-group{width:min(37%,245px)}.meter-group.boss{align-items:flex-end;text-align:right}.meter-name{font-size:clamp(9px,1.8vw,15px);font-weight:800;letter-spacing:2px;margin-bottom:6px}.meter{height:8px;background:#130e1b;border:1px solid #b8a7a380;margin-bottom:4px;box-shadow:0 1px 1px #000}.meter>div{height:100%;width:100%;transition:width .12s linear;background:linear-gradient(90deg,#a63843,#e06b64)}.meter.posture{height:5px;border-color:#b9a27c80}.meter.posture>div{background:linear-gradient(90deg,#b98a46,#f7d98c)}#bossHealth{background:linear-gradient(90deg,#9c3042,#ee7388)}.nodes{font-size:14px;letter-spacing:5px;color:#e8b9b5}.smalltag{font-size:9px;color:#e1c99d}.message{position:absolute;z-index:6;top:26%;left:50%;transform:translateX(-50%);font-size:clamp(14px,3.5vw,30px);white-space:nowrap;color:#f1dbc5;font-weight:900;letter-spacing:7px;text-shadow:0 2px #000,0 0 20px #e0647c;pointer-events:none;opacity:0;transition:opacity .15s}.message.show{opacity:1}.screen{position:absolute;z-index:10;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(90deg,#080a12df,#19101d9e,#080a12df);padding:12px 20px}.screen.hidden{display:none}.eyebrow{font-size:clamp(9px,1.5vw,13px);letter-spacing:5px;color:#d7a1a6;margin-bottom:6px}.screen h1{font-size:clamp(33px,8.2vw,80px);font-weight:900;letter-spacing:.22em;margin:0 0 2px .2em;text-shadow:3px 4px #4e182c,0 0 30px #cd4c7559}.screen .eng{font-size:clamp(7px,1.2vw,11px);letter-spacing:6px;color:#ac97a0;margin:4px 0 12px}.screen .desc{font-size:clamp(10px,1.8vw,15px);line-height:1.9;margin:0 0 12px;color:#dccab9}.primary{border:1px solid #f0bea8;background:#743744cf;padding:10px 34px;box-shadow:0 0 0 3px #301922;letter-spacing:5px;font-weight:900;font-size:clamp(12px,2vw,16px)}.primary:active{transform:translateY(2px);background:#bd5b65}.hint{margin-top:12px;font-size:clamp(9px,1.4vw,12px);color:#c2aeb5;letter-spacing:1px}.touchbar{display:flex;gap:8px;align-items:center;justify-content:space-between;min-height:104px;padding:15px 3px 5px;touch-action:none}.cluster{display:flex;align-items:center;gap:9px}.cluster.right{gap:9px}.ctrl{touch-action:none;border:1px solid #72616a;background:linear-gradient(#332734,#1c1c29);box-shadow:inset 0 1px #9e7d8655,0 4px 0 #0b0c14;min-width:clamp(48px,11vw,75px);height:clamp(52px,11vw,67px);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:800;font-size:20px;color:#f0dcc8}.ctrl small{font-size:10px;font-weight:600;letter-spacing:1px;color:#c5b5ad}.ctrl:active,.ctrl.pressed{background:linear-gradient(#83485b,#4f2c42);border-color:#e5a2a2;transform:translateY(3px);box-shadow:inset 0 1px #fcb7a655,0 1px 0 #0b0c14}.ctrl.attack{background:linear-gradient(#8d3a4f,#502538);border-color:#bf7886}.ctrl.parry{background:linear-gradient(#736044,#382b2a);border-color:#b99e74}.ctrl.dodge{background:linear-gradient(#415468,#25303b)}.help{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:#968b97;margin:7px 3px;line-height:1.5}.help b{color:#d8b4a0;font-weight:500}.desktopnote{display:block}.touchhint{display:none}.orientation{display:none}.sr-only{position:absolute;left:-9999px}@media(min-width:950px) and (pointer:fine){.touchbar{opacity:.75}.ctrl{min-width:70px}}
@media(max-width:650px){#shell{padding:7px 5px max(5px,env(safe-area-inset-bottom))}.mast{margin-bottom:5px}.brand strong{font-size:19px}.brand em{font-size:7px;letter-spacing:1px}.topbtn{padding:5px 8px;font-size:11px}.gameframe{border-width:1px}.touchbar{padding:15px 1px 4px;min-height:93px;gap:3px}.cluster,.cluster.right{gap:5px}.ctrl{min-width:clamp(43px,12.3vw,65px);height:61px;font-size:18px;border-radius:7px}.ctrl small{font-size:9px}.help{font-size:10px;margin:3px 2px}.desktopnote{display:none}.touchhint{display:block}.hud{inset:6px 8px auto}.meter{height:6px}.meter-name{margin-bottom:3px}.nodes{font-size:11px}.screen .hint{margin-top:6px}.screen .desc{line-height:1.4}}@media(max-width:380px){.ctrl{min-width:41px;height:54px}.cluster,.cluster.right{gap:3px}.touchbar{min-height:76px;padding-top:10px}.help{font-size:9px}}@media(orientation:landscape) and (max-height:570px){body{display:block}#shell{width:min(100vw,1100px);padding:2px 4px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(162px,22vw);grid-template-rows:auto 1fr auto;gap:3px}.mast{grid-column:1/-1;margin:0 3px}.brand strong{font-size:16px}.topbtn{padding:3px 8px}.gameframe{grid-column:1;grid-row:2;align-self:center}.touchbar{grid-column:2;grid-row:2;display:grid;align-content:center;min-height:0;padding:0 3px;gap:12px}.cluster,.cluster.right{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}.ctrl{min-width:clamp(37px,5.5vw,55px);height:clamp(36px,9vh,58px);font-size:15px}.ctrl small{font-size:8px}.help{grid-column:1/-1;grid-row:3;display:none}.screen h1{font-size:clamp(26px,8vh,60px)}.screen .desc{font-size:11px;margin-bottom:6px}.screen .hint{display:none}.screen .eng{margin:3px 0 5px}.primary{padding:6px 30px}.eyebrow{margin:0}}@media(max-height:450px) and (orientation:portrait){.help{display:none}.touchbar{padding-top:6px}.ctrl{height:46px}}

<body><main id="shell">
<header class="mast"><div class="brand"><strong>影刃 <span style="color:#c65f74">·</span> 残月</strong><em>SHADOW BLADE</em></div><div class="headbuttons"><button class="topbtn" id="mute" aria-label="切换声音">♫ 音效开</button><button class="topbtn" id="full" aria-label="全屏">⛶ 全屏</button></div></header>
<section class="gameframe" id="frame" aria-label="横版像素动作游戏"><canvas id="game" width="480" height="270"></canvas><div class="framevignette"></div>
<div class="hud" id="hud"><div class="meter-group"><div class="meter-name">影 · 无名忍者</div><div class="meter"><div id="hpFill"></div></div><div class="meter posture"><div id="ppFill" style="width:0"></div></div><div class="smalltag" id="flasks">◆ ◆ ◆　生命 / 架势</div></div><div class="meter-group boss" id="bossHud" style="visibility:hidden"><div class="meter-name" id="bossName">鬼面武士</div><div class="meter"><div id="bossHealth"></div></div><div class="meter posture"><div id="bossPosture" style="width:0"></div></div><div class="nodes" id="bossNodes">● ●</div></div></div>
<div class="message" id="message" role="status"></div>
<div class="screen" id="menu"><div class="eyebrow">一命 · 一刀 · 一念</div><h1>影刃</h1><div class="eng">SHADOW OF THE FALLEN MOON</div><p class="desc">穿过月下神社，击破鬼面武士。<br/>弹反蓄积架势，破防后发动<span style="color:#f2b6a3">忍杀</span>。</p><button class="primary" id="start">拔 刀 出 鞘</button><div class="hint">移动 · 斩击 · 弹反 · 闪避　｜　建议打开声音</div></div>
<div class="screen hidden" id="end"><div class="eyebrow" id="endEyebrow">刀刃未折 · 意志尚存</div><h1 id="endTitle">败北</h1><p class="desc" id="endText">忍者，站起来。</p><button class="primary" id="restart">再 战 一 次</button><div class="hint" id="endStats"> </div></div>
</section>
<nav class="touchbar" aria-label="手机触屏操作"><div class="cluster"><button class="ctrl" data-action="left" aria-label="向左移动">◀<small>左移</small></button><button class="ctrl" data-action="right" aria-label="向右移动">▶<small>右移</small></button></div><div class="cluster right"><button class="ctrl" data-action="jump" aria-label="跳跃">↑<small>跳跃</small></button><button class="ctrl dodge" data-action="dodge" aria-label="闪避">↝<small>闪避</small></button><button class="ctrl parry" data-action="parry" aria-label="弹反或格挡">✦<small>弹反</small></button><button class="ctrl attack" data-action="attack" aria-label="斩击或忍杀">⚔<small>斩击</small></button></div></nav>
<footer class="help"><span class="desktopnote">键盘：<b>A / D</b> 移动　 <b>J</b> 斩击　 <b>K</b> 弹反　 <b>L</b> 闪避　 <b>空格</b> 跳跃</span><span class="touchhint">触按「弹反」格挡，<b>敌刀命中瞬间</b>按下可完美弹反</span><span>原创像素作品 · 离线可玩</span></footer>
</main>
<script>
(()=>{'use strict';
const C=document.getElementById('game'),g=C.getContext('2d',{alpha:false}),W=480,H=270,G=207,WORLD=1320,PI=Math.PI;
g.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id), keys={left:false,right:false,parry:false}, sparks=[],floatText=[],dust=[],petals=[],stars=[];
let state='menu',time=0,cam=0,shake=0,flash=0,hitStop=0,kills=0,parries=0,best=0,audioOn=true,ac=null,toastTimer=0,toastText='',stageClear=false,bossIntro=false,player,enemies=[];
try{best=+(localStorage.getItem('shadowBladeBest')||0)}catch(_){}
function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function poly(points,c){g.fillStyle=c;g.beginPath();g.moveTo(Math.round(points[0][0]),Math.round(points[0][1]));for(let i=1;i<points.length;i++)g.lineTo(Math.round(points[i][0]),Math.round(points[i][1]));g.closePath();g.fill()}
function line(x,y,x2,y2,c,w=1){g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke()}
function sound(type){if(!audioOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let now=ac.currentTime;const osc=(freq,end,vol,shape='triangle',duration=.12)=>{let o=ac.createOscillator(),a=ac.createGain();o.type=shape;o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(Math.max(30,end),now+duration);a.gain.setValueAtTime(vol,now);a.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(a);a.connect(ac.destination);o.start(now);o.stop(now+duration+.01)};
if(type==='slash')osc(620,140,.065,'sawtooth',.10);
if(type==='hit'){osc(150,43,.16,'sawtooth',.14);osc(900,160,.055,'triangle',.10)}
if(type==='parry'){osc(850,1200,.13,'square',.13);osc(1650,700,.065,'triangle',.24)}
if(type==='hurt')osc(190,38,.15,'sawtooth',.22);
if(type==='dash')osc(320,70,.045,'triangle',.18);
if(type==='death'){osc(370,48,.16,'sawtooth',.43);osc(110,36,.09,'sine',.5)}
if(type==='jump')osc(230,440,.035,'sine',.14)}catch(_){}}
function vibrate(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(_){}}
for(let i=0;i<115;i++)stars.push({x:rnd(0,W),y:rnd(4,165),r:Math.random()>.84?2:1,a:rnd(.25,1)});
for(let i=0;i<45;i++)petals.push({x:rnd(0,W),y:rnd(0,H),s:rnd(.35,1.1),o:rnd(0,6.28),r:rnd(1,2.5)});
function makeEnemy(x,boss=false){return {x,y:G,vx:0,face:-1,boss,hp:boss?90:40,maxHp:boss?90:40,posture:0,maxPosture:boss?100:60,phase:1,nodes:boss?2:1,active:true,dead:0,stagger:0,state:'idle',timer:0,cooldown:boss?1.0:rnd(.8,1.5),intent:'normal',landed:false,anim:rnd(0,6),alerted:false}}
function reset(){state='playing';time=0;cam=0;shake=0;flash=0;hitStop=0;kills=0;parries=0;stageClear=false;bossIntro=false;toastTimer=0;keys.left=keys.right=keys.parry=false;player={x:62,y:G,vy:0,face:1,hp:100,maxHp:100,posture:0,grounded:true,attackT:0,attackN:0,attackHit:false,attackQueued:false,guard:0,parry:0,parryCD:0,dash:0,dashCD:0,inv:0,hurt:0,stun:0,anim:0};enemies=[makeEnemy(275),makeEnemy(545),makeEnemy(1040,true)];sparks.length=0;floatText.length=0;dust.length=0;$('hud').classList.add('show');$('bossHud').style.visibility='hidden';$('menu').classList.add('hidden');$('end').classList.add('hidden');notify('残月神社',1.8);hud()}
function end(win){if(state!=='playing')return;state=win?'win':'lost';$('end').classList.remove('hidden');$('endTitle').textContent=win?'忍杀成功':'败北';$('endEyebrow').textContent=win?'月下传说 · 无名之刃':'生死一瞬 · 重新拔刀';$('endText').textContent=win?'鬼面已斩，残月终将升起。':'别急着出刀。读懂敌人的起手，弹反才是胜机。';$('restart').textContent=win?'再 闯 一 次':'再 战 一 次';$('endStats').textContent=`弹反 ${parries} 次 · 击败 ${kills} 人`;if(win){sound('death');if(best===0||time<best){best=time;try{localStorage.setItem('shadowBladeBest',best)}catch(_){}}}}
function notify(t,s=1.0){toastText=t;toastTimer=s;$('message').textContent=t;$('message').classList.add('show')}
function addSpark(x,y,kind,n=13){let cols=kind==='parry'?['#fff9e3','#f5d38a','#ffe9b0','#f6a4a0']:kind==='blood'?['#bd405b','#ec7b8d','#762d49']:['#fff3d1','#faac75','#e77676'];for(let i=0;i<n;i++)sparks.push({x,y,vx:rnd(-100,100),vy:rnd(-105,30),life:rnd(.16,.38),max:.4,c:cols[Math.random()*cols.length|0],r:Math.random()>.77?3:2})}
function addText(x,y,t,c='#ffe1ad'){floatText.push({x,y,t,c,life:.7})}
function puff(x,y){for(let i=0;i<8;i++)dust.push({x:x+rnd(-6,6),y:y+rnd(-2,0),vx:rnd(-20,20),vy:rnd(-20,-2),life:rnd(.2,.55),r:rnd(2,5)})}
function attack(){if(state!=='playing'||player.stun>0)return;if(player.attackT>.10){player.attackQueued=true;return}if(player.attackT>0)return;if(player.dash>0)return;player.attackN=player.attackN%3+1;player.attackT=.31;player.attackHit=false;player.guard=0;player.parry=0;player.attackQueued=false;sound('slash');player.x+=player.face*4}
function parryDown(){if(state!=='playing'||player.stun>0)return;keys.parry=true;if(player.parryCD<=0){player.parry=.2;player.parryCD=.28;player.guard=1;addSpark(player.x+player.face*15,player.y-21,'hit',3);sound('slash')}else player.guard=1}
function parryUp(){keys.parry=false;player.guard=0}
function dodge(){if(state!=='playing'||player.dashCD>0||player.stun>0)return;player.dash=.2;player.dashCD=.68;player.inv=.26;player.guard=0;player.parry=0;player.attackT=0;shake=Math.max(shake,1.3);puff(player.x,player.y);sound('dash')}
function jump(){if(state!=='playing'||!player.grounded||player.stun>0)return;player.vy=-268;player.grounded=false;player.guard=0;puff(player.x,player.y);sound('jump')}
function nearTarget(){return enemies.filter(e=>e.active).sort((a,b)=>Math.abs(a.x-player.x)-Math.abs(b.x-player.x))[0]}
function bladeHit(){let foe=nearTarget();if(!foe)return;let dx=foe.x-player.x;if(Math.abs(dx)>49||Math.abs(foe.y-player.y)>38||dx*player.face<-15)return;let execution=foe.stagger>0;
if(execution){foe.nodes--;foe.stagger=0;foe.posture=0;foe.hp=0;shake=12;flash=.17;hitStop=.2;addSpark(foe.x,foe.y-28,'blood',40);addText(foe.x,foe.y-54,'忍 杀','#ffd0be');sound('death');vibrate([30,40,55]);player.inv=.35;
if(foe.nodes<=0){foe.active=false;foe.dead=.7;kills++;if(foe.boss){setTimeout(()=>{if(state==='playing')end(true)},880)}else notify('敌将已破',.7)}else{foe.phase=2;foe.hp=foe.maxHp;foe.cooldown=1.2;foe.state='idle';foe.timer=0;notify('鬼面 · 第二形态',1.9);addSpark(foe.x,foe.y-26,'blood',34)}return}
let dmg=player.attackN===3?15:10;foe.hp=Math.max(0,foe.hp-dmg);foe.posture=Math.min(foe.maxPosture,foe.posture+(foe.boss?17:23)+(player.attackN===3?7:0));foe.state=foe.state==='windup'?foe.state:'recovery';foe.timer=foe.state==='recovery'?.25:foe.timer;foe.cooldown=Math.max(foe.cooldown,.33);shake=4.3;hitStop=.065;addSpark(foe.x,foe.y-24,'blood',17);addText(foe.x,foe.y-45,''+dmg,'#ffd5bd');sound('hit');vibrate(17);if(foe.posture>=foe.maxPosture||foe.hp<=0){breakPosture(foe)}}
function breakPosture(e){if(e.stagger>0)return;e.stagger=3.0;e.state='stagger';e.timer=0;shake=7;notify(e.boss?'架势崩溃 · 立即忍杀！':'破防！斩击发动忍杀',1.4);addSpark(e.x,e.y-31,'parry',24);sound('parry')}
function enemyStrike(e){if(e.landed||!e.active)return;e.landed=true;let d=Math.abs(e.x-player.x);if(d>(e.boss?51:45)||Math.abs(e.y-player.y)>48)return;if(player.inv>0||player.dash>0){addText(player.x,player.y-46,'闪','#d3f5ff');return}if(e.intent==='sweep'&&player.y<G-15){addText(player.x,player.y-46,'避','#c8f3e6');return}
if(player.parry>0&&e.intent!=='sweep'){player.parry=0;parries++;e.posture=clamp(e.posture+(e.boss?34:43),0,e.maxPosture);player.posture=Math.max(0,player.posture-14);shake=8;flash=.10;hitStop=.11;addSpark((player.x+e.x)/2,player.y-27,'parry',30);addText(player.x,player.y-53,'完美弹反','#fff5bc');sound('parry');vibrate([17,25,22]);if(e.posture>=e.maxPosture)breakPosture(e);return}
if(player.guard>0&&e.intent!=='sweep'){player.posture=Math.min(100,player.posture+(e.boss?33:24));shake=3;addSpark(player.x+player.face*11,player.y-23,'hit',10);addText(player.x,player.y-48,'格挡','#ded4ca');sound('hit');if(player.posture>=100){player.stun=.85;player.posture=58;player.guard=0;notify('架势被破！',.8)}return}
let dmg=e.boss?(e.phase===2?25:22):17;player.hp=Math.max(0,player.hp-dmg);player.posture=Math.min(99,player.posture+18);player.hurt=.35;player.inv=.5;player.guard=0;shake=9;flash=.12;hitStop=.075;player.x+=e.face*14;addSpark(player.x,player.y-26,'blood',22);addText(player.x,player.y-53,'-'+dmg,'#ff8da0');sound('hurt');vibrate(45);if(player.hp<=0)setTimeout(()=>{if(state==='playing')end(false)},500)}
